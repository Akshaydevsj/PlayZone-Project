{% extends 'base.html' %}
{% block body_class %}shopping-page{% endblock %}

{% block section %}

<style>
/* PASSWORD FIELD WRAPPER */
.password-wrapper {
  position: relative;
}

.password-wrapper input {
  padding-right: 42px; /* space for eye icon */
}

/* EYE ICON */
.password-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  font-size: 16px;
  color: #666;
}

.password-toggle:hover {
  color: #000;
}
</style>

<div class="site-section" style="padding-top:140px;">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="cart-item">

          <h3 class="heading mb-4 text-center">Change Password</h3>

          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-warning">{{ message }}</div>
            {% endfor %}
          {% endif %}

          <form method="post">
            {% csrf_token %}

            <!-- CURRENT PASSWORD -->
            <div class="form-group mb-3">
              <label>Current Password</label>

              <div class="password-wrapper">
                <input type="password"
                       name="old_password"
                       id="old_password"
                       class="form-control"
                       required>

                <i class="fa fa-eye-slash password-toggle"
                   onclick="togglePassword('old_password', this)"></i>
              </div>
            </div>

            <!-- NEW PASSWORD -->
            <div class="form-group mb-3">
              <label>New Password</label>

              <div class="password-wrapper">
                <input type="password"
                       name="new_password"
                       id="new_password"
                       class="form-control"
                       required>

                <i class="fa fa-eye-slash password-toggle"
                   onclick="togglePassword('new_password', this)"></i>
              </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="form-group mb-4">
              <label>Confirm Password</label>

              <div class="password-wrapper">
                <input type="password"
                       name="confirm_password"
                       id="confirm_password"
                       class="form-control"
                       required>

                <i class="fa fa-eye-slash password-toggle"
                   onclick="togglePassword('confirm_password', this)"></i>
              </div>
            </div>

            <button type="submit"
                    class="btn btn-danger btn-block">
              Update Password
            </button>

          </form>

        </div>

      </div>
    </div>

  </div>
</div>

<script>
function togglePassword(inputId, icon) {
  const input = document.getElementById(inputId);

  if (input.type === "password") {
    input.type = "text";
    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");
  } else {
    input.type = "password";
    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");
  }
}
</script>

{% endblock %}
