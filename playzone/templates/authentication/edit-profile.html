{% extends 'base.html' %}
{% block body_class %}shopping-page{% endblock %}

{% block section %}

<div class="site-section" style="padding-top:140px;">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-md-8">

        <div class="cart-item">

          <h3 class="heading mb-4 text-center">Edit Profile</h3>

          {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
          {% endfor %}

          <form method="post">
            {% csrf_token %}

            <div class="row">
              <div class="col-md-6 form-group">
                <label>First Name</label>
                <input type="text"
                       name="first_name"
                       value="{{ request.user.first_name }}"
                       class="form-control"
                       required>
              </div>

              <div class="col-md-6 form-group">
                <label>Last Name</label>
                <input type="text"
                       name="last_name"
                       value="{{ request.user.last_name }}"
                       class="form-control"
                       required>
              </div>
            </div>

            <div class="form-group">
              <label>Email</label>
              <input type="email"
                     name="email"
                     value="{{ request.user.email }}"
                     class="form-control"
                     required>
            </div>

            <div class="form-group">
              <label>Phone</label>
              <input type="text"
                     name="phone"
                     value="{{ profile.phone }}"
                     class="form-control"
                     required>
            </div>

            <div class="d-flex justify-content-between mt-4">

              <a href="{% url 'account' %}"
                 class="btn btn-outline-secondary">
                Cancel
              </a>

              <button class="btn btn-danger">
                Save Changes
              </button>

            </div>

          </form>

        </div>

      </div>
    </div>

  </div>
</div>

{% endblock %}
