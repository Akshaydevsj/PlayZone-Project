{% extends 'base.html' %}
{% block body_class %}shopping-page{% endblock %}

{% block section %}

<div class="site-section" style="padding-top:140px;">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="cart-item">

          <h3 class="heading mb-4 text-center">
            Forgot Password
          </h3>

          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-warning">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}

          <form method="post">
            {% csrf_token %}

            <div class="form-group">
              <label>Email Address</label>
              <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your registered email"
                required
              >
            </div>

            <button type="submit" class="btn btn-danger btn-block mt-3">
              Send OTP
            </button>

          </form>

        </div>

      </div>
    </div>

  </div>
</div>

{% endblock %}
