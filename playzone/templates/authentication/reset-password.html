{% extends 'base.html' %}
{% block body_class %}shopping-page{% endblock %}

{% block section %}

<style>
/* PASSWORD FIELD WRAPPER – SAME AS LOGIN */
.password-wrapper {
  position: relative;
  display: flex;
  align-items: center; /* TRUE CENTER */
}

.password-wrapper input {
  padding-right: 42px;
}

/* EYE ICON – SAME AS LOGIN */
.password-toggle {
  position: absolute;
  right: 12px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
  color: #666;
}

.password-toggle:hover {
  color: #000;
}
</style>

<div class="site-section" style="padding-top:140px;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="cart-item">

          <h3 class="heading mb-4 text-center">Reset Password</h3>

          {% for message in messages %}
            <div class="alert alert-warning">{{ message }}</div>
          {% endfor %}

          <form method="post">
            {% csrf_token %}

            <!-- OTP -->
            <div class="form-group mb-3">
              <label>OTP</label>
              <input type="text"
                     name="otp"
                     class="form-control"
                     required>
            </div>

            <!-- NEW PASSWORD -->
            <div class="form-group mb-3">
              <label>New Password</label>

              <div class="password-wrapper">
                <input type="password"
                       id="new_password"
                       name="password"
                       class="form-control"
                       required>

                <span class="password-toggle"
                      onclick="togglePassword('new_password', this)">
                  <i class="fa fa-eye-slash"></i>
                </span>
              </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="form-group mb-4">
              <label>Confirm Password</label>

              <div class="password-wrapper">
                <input type="password"
                       id="confirm_password"
                       name="confirm_password"
                       class="form-control"
                       required>

                <span class="password-toggle"
                      onclick="togglePassword('confirm_password', this)">
                  <i class="fa fa-eye-slash"></i>
                </span>
              </div>
            </div>

            <button class="btn btn-danger btn-block">
              Reset Password
            </button>
          </form>

          <hr>

          <div class="text-center">
            <a href="{% url 'resend-otp' %}" class="text-primary">
              Resend OTP
            </a>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>

<script>
function togglePassword(inputId, el) {
  const input = document.getElementById(inputId);
  const icon  = el.querySelector("i");

  if (input.type === "password") {
    input.type = "text";
    icon.classList.replace("fa-eye-slash", "fa-eye");
  } else {
    input.type = "password";
    icon.classList.replace("fa-eye", "fa-eye-slash");
  }
}
</script>

{% endblock %}
