{% extends 'base.html' %}
{% block body_class %}shopping-page{% endblock %}

{% block section %}

<style>
/* PASSWORD FIELD WRAPPER – SAME AS LOGIN */
.password-wrapper {
  position: relative;
  display: flex;
  align-items: center; /* TRUE CENTER */
}

.password-wrapper input {
  padding-right: 42px;
}

/* EYE ICON – SAME AS LOGIN */
.password-toggle {
  position: absolute;
  right: 12px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
  color: #666;
}

.password-toggle:hover {
  color: #000;
}
</style>

<div class="site-section" style="padding-top:140px;">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-md-8">

        <div class="cart-item">

          <h3 class="heading mb-4 text-center">Create Your Account</h3>

          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-warning">{{ message }}</div>
            {% endfor %}
          {% endif %}

          <form method="post">
            {% csrf_token %}

            <!-- NAME -->
            <div class="row">
              <div class="col-md-6 form-group">
                <label>First Name</label>
                <input type="text"
                       name="first_name"
                       class="form-control"
                       required>
              </div>

              <div class="col-md-6 form-group">
                <label>Last Name</label>
                <input type="text"
                       name="last_name"
                       class="form-control"
                       required>
              </div>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
              <label>Email</label>
              <input type="email"
                     name="email"
                     class="form-control"
                     required>
            </div>

            <!-- PHONE -->
            <div class="form-group">
              <label>Phone Number</label>
              <input type="text"
                     name="phone"
                     class="form-control"
                     required>
            </div>

            <!-- PASSWORDS -->
            <div class="row">

              <!-- PASSWORD -->
              <div class="col-md-6 form-group">
                <label>Password</label>

                <div class="password-wrapper">
                  <input type="password"
                         name="password"
                         id="signup_password"
                         class="form-control"
                         required>

                  <span class="password-toggle"
                        onclick="togglePassword('signup_password', this)">
                    <i class="fa fa-eye-slash"></i>
                  </span>
                </div>
              </div>

              <!-- CONFIRM PASSWORD -->
              <div class="col-md-6 form-group">
                <label>Confirm Password</label>

                <div class="password-wrapper">
                  <input type="password"
                         name="confirm_password"
                         id="signup_confirm_password"
                         class="form-control"
                         required>

                  <span class="password-toggle"
                        onclick="togglePassword('signup_confirm_password', this)">
                    <i class="fa fa-eye-slash"></i>
                  </span>
                </div>
              </div>

            </div>

            <button type="submit"
                    class="btn btn-danger btn-block mt-3">
              Create Account
            </button>

            <hr>

            <div class="text-center">
              <p class="mb-0">
                Already have an account?
                <a href="{% url 'login' %}" class="text-primary">
                  Login
                </a>
              </p>
            </div>

          </form>

        </div>

      </div>
    </div>

  </div>
</div>

<script>
function togglePassword(inputId, el) {
  const input = document.getElementById(inputId);
  const icon  = el.querySelector("i");

  if (input.type === "password") {
    input.type = "text";
    icon.classList.replace("fa-eye-slash", "fa-eye");
  } else {
    input.type = "password";
    icon.classList.replace("fa-eye", "fa-eye-slash");
  }
}
</script>

{% endblock %}
