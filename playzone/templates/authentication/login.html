{% extends 'base.html' %}
{% block body_class %}shopping-page{% endblock %}

{% block section %}

<style>
/* PASSWORD FIELD WRAPPER */
.password-wrapper {
  position: relative;
  display: flex;
  align-items: center; /* ✅ TRUE CENTER */
}

.password-wrapper input {
  padding-right: 42px;
}

/* EYE ICON */
.password-toggle {
  position: absolute;
  right: 12px;
  display: flex;
  align-items: center;   /* ✅ CENTER */
  justify-content: center;
  height: 100%;
  cursor: pointer;
  font-size: 16px;
  color: #666;
}

.password-toggle:hover {
  color: #000;
}
</style>

<div class="site-section" style="padding-top:140px;">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="cart-item">

          <h3 class="heading mb-4 text-center">Login to PlayZone</h3>

          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-warning">{{ message }}</div>
            {% endfor %}
          {% endif %}

          <form method="post">
            {% csrf_token %}

            <!-- EMAIL -->
            <div class="form-group mb-3">
              <label>Email Address</label>
              <input type="email"
                     name="email"
                     class="form-control"
                     required>
            </div>

            <!-- PASSWORD -->
            <div class="form-group mb-4">
              <label>Password</label>

              <div class="password-wrapper">
                <input type="password"
                       name="password"
                       id="login_password"
                       class="form-control"
                       required>

                <span class="password-toggle"
                      onclick="togglePassword('login_password', this)">
                  <i class="fa fa-eye-slash"></i>
                </span>
              </div>
            </div>

            <button type="submit" class="btn btn-danger btn-block">
              Login
            </button>

            <div class="text-center mt-3">
              <a href="{% url 'forgot-password' %}" class="text-danger">
                Forgot password?
              </a>
            </div>

            <hr>

            <div class="text-center">
              <p class="mb-0">
                Don’t have an account?
                <a href="{% url 'signup' %}" class="text-primary">
                  Sign up
                </a>
              </p>
            </div>

          </form>

        </div>

      </div>
    </div>

  </div>
</div>

<script>
function togglePassword(inputId, el) {
  const input = document.getElementById(inputId);
  const icon  = el.querySelector("i");

  if (input.type === "password") {
    input.type = "text";
    icon.classList.replace("fa-eye-slash", "fa-eye");
  } else {
    input.type = "password";
    icon.classList.replace("fa-eye", "fa-eye-slash");
  }
}
</script>

{% endblock %}
