{% extends 'base.html' %}
{% block body_class %}shopping-page{% endblock %}

{% block section %}

<div class="site-section" style="padding-top:140px;">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-md-8">

        <div class="cart-item">

          <h3 class="heading mb-4 text-center">Edit Address</h3>

          <form method="post">
            {% csrf_token %}

            <div class="form-group">
              <label>Full Name</label>
              <input type="text" name="full_name"
                     value="{{ address.full_name }}"
                     class="form-control" required>
            </div>

            <div class="form-group">
              <label>Phone</label>
              <input type="text" name="phone"
                     value="{{ address.phone }}"
                     class="form-control" required>
            </div>

            <div class="form-group">
              <label>House / Flat</label>
              <input type="text" name="house"
                     value="{{ address.house }}"
                     class="form-control" required>
            </div>

            <div class="form-group">
              <label>Street</label>
              <input type="text" name="street"
                     value="{{ address.street }}"
                     class="form-control" required>
            </div>

            <div class="row">
              <div class="col-md-6 form-group">
                <label>City</label>
                <input type="text" name="city"
                       value="{{ address.city }}"
                       class="form-control" required>
              </div>

              <div class="col-md-6 form-group">
                <label>State</label>
                <input type="text" name="state"
                       value="{{ address.state }}"
                       class="form-control" required>
              </div>
            </div>

            <div class="form-group">
              <label>Pincode</label>
              <input type="text" name="pincode"
                     value="{{ address.pincode }}"
                     class="form-control" required>
            </div>

            <button type="submit" class="btn btn-danger btn-block mt-3">
              Update Address
            </button>

            <a href="{% url 'account' %}"
               class="btn btn-outline-secondary btn-block mt-2">
              Cancel
            </a>

          </form>

        </div>

      </div>
    </div>

  </div>
</div>

{% endblock %}
