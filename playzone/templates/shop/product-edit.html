{% extends 'base.html' %}

{% block section %}

<div class="site-section">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-md-8">

        <h2 class="heading mb-4">Edit Product</h2>

        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}

          {{ form.as_p }}

          <button type="submit" class="btn btn-primary">
            Update Product
          </button>
        </form>

      </div>
    </div>

  </div>
</div>

{% endblock %}
